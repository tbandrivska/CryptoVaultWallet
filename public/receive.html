<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoVault — Receive</title>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/receive.css">
</head>
<body>

<nav class="top-nav">
  <a class="logo" href="/index.html">Crypto<span>Vault</span></a>
  <a href="/index.html">Home</a>
  <a href="/portfolio.html">Portfolio</a>
  <a href="/send.html">Send</a>
  <a href="/receive.html" class="active">Receive</a>
  <a href="/history.html">History</a>
  <a href="/publicprofile.html">Public Profile</a>
  <a href="/settings.html">Settings</a>
  <a href="/logout">Logout</a>
</nav>

<div class="page-wrap">

  <div class="page-head">
    <h1>Receive <span>Crypto</span></h1>
    <p>Share your address to receive funds</p>
  </div>

  <div class="receive-card">
    <label for="walletSelect" class="address-label">Select Wallet</label>
    <select id="walletSelect"></select>

    <p class="address-label" style="margin-top:20px;">Your Wallet Address</p>
    <div class="address-box" id="address">Loading address…</div>

    <button class="btn btn-primary" style="margin-top:0" onclick="copyAddress()">
      Copy Address
    </button>
    <p class="copy-confirm" id="copyMsg"></p>
  </div>

</div>

<script>
  async function getCurrentUserId() {
    const res = await fetch('/api/user');
    if (!res.ok) throw new Error('Not logged in');
    const data = await res.json();
    return data.user.id;
  }

  async function loadWalletsAndAddresses() {
    const userId = await getCurrentUserId();
    const res = await fetch(`/api/transactions/wallets/${userId}`);
    const wallets = await res.json();
    const select = document.getElementById('walletSelect');
    const addressBox = document.getElementById('address');

    if (!Array.isArray(wallets) || wallets.length === 0) {
      select.innerHTML = '<option>No wallets found</option>';
      addressBox.textContent = 'No address found.';
      return;
    }

    select.innerHTML = wallets.map(w =>
      `<option value="${w.currency}">${w.name ? w.name + ' — ' : ''}${w.currency}</option>`
    ).join('');

    showAddress(userId, wallets[0].currency);
    select.onchange = () => showAddress(userId, select.value);
  }

  async function showAddress(userId, currency) {
    const addressBox = document.getElementById('address');
    try {
      const res = await fetch(`/api/transactions/wallets/${userId}/${currency}/address`);
      const data = await res.json();
      addressBox.textContent = data.address || 'No address found.';
    } catch {
      addressBox.textContent = 'No address found.';
    }
  }

  function copyAddress() {
    const address = document.getElementById('address').innerText.trim();
    navigator.clipboard.writeText(address).then(() => {
      const el = document.getElementById('copyMsg');
      el.textContent = '✓ Address copied to clipboard';
      setTimeout(() => { el.textContent = ''; }, 3000);
    });
  }

  document.addEventListener('DOMContentLoaded', loadWalletsAndAddresses);
</script>
</body>
</html>
