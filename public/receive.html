  <meta charset="UTF-8">

</head>
<body>

<nav class="top-nav">
  <a class="logo" href="/index.html">Crypto<span>Vault</span></a>
  <a href="/index.html">Home</a>
  <a href="/topup.html">Top Up</a>
  <a href="/portfolio.html">Portfolio</a>

<div class="page-wrap">

  <div class="page-head">
    <h1>Receive <span>Crypto</span></h1>
    <p>Share your address or QR code to receive funds</p>
  </div>

  <div class="receive-card">

    <p class="address-label">Your Wallet Address</p>
    <div class="address-box" id="address">
      0x91bF72A9cD34Ef123456789
    </div>

    <button class="btn btn-primary" style="margin-top:0" onclick="copyAddress()">
      Copy Address
    </button>

    <p class="copy-confirm" id="copyMsg"></p>

  </div>
</div>

<script>
function copyAddress() {
  const address = document.getElementById('address').innerText.trim();
  navigator.clipboard.writeText(address).then(() => {
    const el = document.getElementById('copyMsg');
    el.textContent = '✓ Address copied to clipboard';
    setTimeout(() => { el.textContent = ''; }, 3000);
  });
}
</script>
</body>
</html>
