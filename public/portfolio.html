<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/shared.css">
    <link rel="stylesheet" href="portfolio.css">
    <title>CryptoVault — Portfolio</title>
    <style>
      /* Inline overrides so buy-crypto card is always correctly positioned */
      .bottom-section {
        margin-left: 272px;
        padding: 0 32px 48px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: start;
      }
      @media (max-width: 860px) { .bottom-section { grid-template-columns: 1fr; } }
      .panel-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-xl);
        padding: 24px;
        box-shadow: var(--shadow-md);
      }
      .panel-card h2 {
        font-family: var(--font-display);
        font-size: 0.95rem; font-weight: 700;
        color: var(--accent); margin-bottom: 16px;
      }
      .wallet-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 9px 0; border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
      }
      .wallet-row:last-child { border-bottom: none; }
      .wallet-currency { font-weight: 700; color: var(--accent); }
      .wallet-balance  { font-family: var(--font-mono); color: var(--text-2); font-size: 0.8rem; }
      .buy-field { margin-bottom: 14px; }
      .buy-field label {
        display: block; font-size: 0.695rem; font-weight: 700;
        letter-spacing: 0.09em; text-transform: uppercase;
        color: var(--text-2); margin-bottom: 6px;
      }
    </style>
</head>
<body id="portfolio">
    <nav class="top-nav">
        <a class="logo" href="/index.html">Crypto<span>Vault</span></a>
        <a href="/index.html" style="margin-left:auto">Home</a>
        <a href="/portfolio.html" class="active">Portfolio</a>
        <a href="/send.html">Send</a>
        <a href="/receive.html">Receive</a>
        <a href="/history.html">History</a>
        <a href="/publicprofile.html">Public Profile</a>
        <a href="/settings.html">Settings</a>
        <a href="/logout">Logout</a>
    </nav>

    <div id="priceContainer">Loading...</div>

    <div class="dashboard" style="min-height:unset; padding-bottom:24px;">
      <div class="wallet-value-card">
        <p class="wallet-label">Total Portfolio Value</p>
        <p id="walletValue">£0.00</p>
      </div>
      <div class="chart-container">
        <canvas id="coinChart"></canvas>
      </div>
    </div>

    <!-- Wallets + Buy Crypto side by side, below the chart -->
    <div class="bottom-section">

      <div class="panel-card">
        <h2>Your Wallets</h2>
        <div id="walletsList">Loading…</div>
      </div>

      <div class="panel-card">
        <h2>Buy Cryptocurrency</h2>
        <form id="buyForm">
          <div class="buy-field">
            <label for="buyCurrency">Currency</label>
            <select id="buyCurrency">
              <option value="BTC">Bitcoin (BTC)</option>
              <option value="ETH">Ethereum (ETH)</option>
            </select>
          </div>
          <div class="buy-field">
            <label for="buyAmount">Amount to spend (GBP)</label>
            <input type="number" id="buyAmount" min="1" step="1" placeholder="e.g. 100" required>
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top:6px;">Buy →</button>
          <div class="status-strip" id="buyMsg" style="margin-top:12px;"></div>
        </form>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
      import { fetchTop20CoinPrice, renderChart } from './coinPrices/coins.js';
      document.addEventListener('DOMContentLoaded', () => {
        fetchTop20CoinPrice();
        renderChart();
      });
    </script>
    <script type="module">
      import { fetchCoinPrice } from './coinPrices/coins.js';

      async function getCurrentUserId() {
        const res = await fetch('/api/user');
        if (!res.ok) throw new Error('Not logged in');
        return (await res.json()).user.id;
      }

      function mapCurrencyToCoinId(currency) {
        const normalized = String(currency).toUpperCase();
        if (normalized === 'BTC') return 'bitcoin';
        if (normalized === 'ETH') return 'ethereum';
        if (normalized === 'LTC') return 'litecoin';
        return normalized.toLowerCase();
      }

      async function convertBalanceToGBP(wallet) {
        if (wallet.currency === 'GBP') {
          return Number(wallet.balance);
        }

        const coinId = mapCurrencyToCoinId(wallet.currency);
        if (!coinId) return null;

        const priceObj = await fetchCoinPrice(coinId);
        if (!priceObj || typeof priceObj.price !== 'number') {
          return null;
        }

        return Number(wallet.balance) * priceObj.price;
      }

      async function loadWallets() {
        const userId  = await getCurrentUserId();
        const wallets = await (await fetch(`/api/transactions/wallets/${userId}`)).json();
        const list = document.getElementById('walletsList');
        if (!Array.isArray(wallets) || wallets.length === 0) {
          list.innerHTML = '<p style="color:var(--text-2);font-size:0.875rem;">No wallets found.</p>';
          document.getElementById('walletValue').textContent = '£0.00';
          return;
        }

        let totalGBP = 0;
        const walletRows = await Promise.all(wallets.map(async (w) => {
          const gbpValue = await convertBalanceToGBP(w);
          if (typeof gbpValue === 'number' && !Number.isNaN(gbpValue)) {
            totalGBP += gbpValue;
          }

          const balanceLabel = gbpValue != null
            ? `£${gbpValue.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}`
            : Number(w.balance).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:8});

          const originalLabel = w.currency !== 'GBP' && gbpValue != null
            ? ` (${Number(w.balance).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:8})} ${w.currency})`
            : '';

          return `<div class="wallet-row">
            <span class="wallet-currency">${w.currency}${w.name ? ' · ' + w.name : ''}</span>
            <span class="wallet-balance">${balanceLabel}${originalLabel}</span>
          </div>`;
        }));

        list.innerHTML = walletRows.join('');
        document.getElementById('walletValue').textContent =
          `£${totalGBP.toLocaleString(undefined,{minimumFractionDigits:2})}`;
      }

      loadWallets();

      document.getElementById('buyForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const currency = document.getElementById('buyCurrency').value;
        const amount   = parseFloat(document.getElementById('buyAmount').value);
        const msgEl    = document.getElementById('buyMsg');
        msgEl.className = 'status-strip show info';
        msgEl.textContent = 'Processing…';
        if (isNaN(amount) || amount <= 0) {
          msgEl.className = 'status-strip show error';
          msgEl.textContent = 'Enter a valid amount.';
          return;
        }
        try {
          const userId = await getCurrentUserId();
          const data   = await (await fetch('/api/transactions/buy', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({userId, currency, amount})
          })).json();
          if (data.success) {
            msgEl.className = 'status-strip show success';
            msgEl.textContent = `✓ Bought ${Number(data.cryptoAmount).toFixed(8)} ${currency} for £${amount.toFixed(2)}`;
            document.getElementById('buyAmount').value = '';
            loadWallets();
          } else {
            msgEl.className = 'status-strip show error';
            msgEl.textContent = data.message || 'Purchase failed.';
          }
        } catch {
          msgEl.className = 'status-strip show error';
          msgEl.textContent = 'Could not reach the server.';
        }
      });
    </script>
</body>
</html>
