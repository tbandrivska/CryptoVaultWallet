    <div class="wallets-list-card settings-card" style="margin: 24px 0;">
      <h2>Your Wallets</h2>
      <div id="walletsList">Loading...</div>
    </div>
    <script>
  async function getCurrentUserId() {
    const res = await fetch('/api/user');
    if (!res.ok) throw new Error('Not logged in');
    const data = await res.json();
    return data.user.id;
}
    async function loadWallets() {
      const userId = await getCurrentUserId();
      const res = await fetch(`/api/transactions/wallets/${userId}`);
      const wallets = await res.json();
      const list = document.getElementById('walletsList');
      if (!Array.isArray(wallets) || wallets.length === 0) {
      list.innerHTML = "<p>No wallets found.</p>";
      document.getElementById('walletValue').textContent = "£0.00";
      return;
      }
      let totalGBP = 0;
      list.innerHTML = wallets.map(w => {
      let displayBalance = Number(w.balance).toLocaleString(undefined, {maximumFractionDigits: 8});
      let currencyLabel = w.currency === 'GBP' ? '£' : w.currency;
      if (w.currency === 'GBP') {
        totalGBP += Number(w.balance);
      }
      return `<div class="wallet-row">
        <span class="wallet-currency">${w.currency}</span>
        <span class="wallet-balance">${displayBalance} ${currencyLabel}</span>
      </div>`;
      }).join('');
      // Update the dashboard total balance to match the GBP wallet
      document.getElementById('walletValue').textContent = `£${totalGBP.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
    }
    loadWallets();
    </script>
</script>
<script>
async function updateWalletValue() {
  const res = await fetch('/api/transactions/wallets/1');
  const wallets = await res.json();
  const gbpWallet = wallets.find(w => w.currency === 'GBP');
  const walletValueElem = document.getElementById('walletValue');
  if (gbpWallet) {
    walletValueElem.textContent = `£${Number(gbpWallet.balance).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
  } else {
    walletValueElem.textContent = "£0.00";
  }
}
updateWalletValue();
</script>
<div class="settings-card buy-crypto-card" style="margin: 64px 24px 0;">
  <h2>Buy Cryptocurrency</h2>
  <form id="buyForm">
    <div class="input-group">
      <label for="buyCurrency">Currency</label>
      <select id="buyCurrency">
        <option value="BTC">Bitcoin (BTC)</option>
        <option value="ETH">Ethereum (ETH)</option>
      </select>
    </div>
    <div class="input-group">
      <label for="buyAmount">Amount (GBP)</label>
      <input type="number" id="buyAmount" min="1" step="1" placeholder="Amount in GBP" required />
    </div>
    <button type="submit" class="btn btn-primary">Buy</button>
    <div id="buyMsg" class="status-text"></div>
  </form>
</div>





<script>
document.getElementById('buyForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const currency = document.getElementById('buyCurrency').value;
  const amount = parseFloat(document.getElementById('buyAmount').value);
  const msg = document.getElementById('buyMsg');
  msg.textContent = '';
  if (isNaN(amount) || amount <= 0) {
    msg.textContent = "Enter a valid amount.";
    msg.style.color = "var(--danger)";
    return;
  }
  //get the real userId
  const userId = await getCurrentUserId();
  const res = await fetch('/api/transactions/buy', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId, currency, amount })
  });
  const data = await res.json();
  if (data.success) {
    msg.textContent = `Bought ${data.cryptoAmount} ${currency} for £${amount.toFixed(2)}!`;
    msg.style.color = "var(--success)";
    document.getElementById('buyAmount').value = '';
    loadWallets(); // Refresh wallet balances
    if (typeof updateWalletValue === 'function') updateWalletValue();
  } else {
    msg.textContent = data.message || "Purchase failed.";
    msg.style.color = "var(--danger)";
  }
});
</script>
