<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoVault — Sign In</title>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body>

<div class="auth-wrap">
<a href="/index.html">Home</a>
  <div class="brand">
    <div class="brand-icon">🔐</div>
    <h1>Crypto<span>Vault</span></h1>
    <p>Sign in to manage your wallet</p>
  </div>

  <div class="auth-card">
    <form action="/login" method="POST">

      <div class="field">
        <label class="field-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field" style="margin-top:18px">
        <label class="field-label" for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button class="btn btn-primary" type="submit">Sign In →</button>
    </form>
  </div>

  <p class="auth-footer">
    Don't have an account? <a href="/register.html">Create one</a>
  </p>

</div>
<script>
  if (window.location.search.includes('error=1')) {
    const err = document.createElement('p');
    err.textContent = 'Invalid email or password.';
    err.style.cssText = 'color:#ff4d6a;font-size:0.85rem;font-weight:600;margin-top:12px;text-align:center;';
    document.querySelector('form').appendChild(err);
  }
  async function getCurrentUserId() {
  const res = await fetch('/api/user');
  if (!res.ok) throw new Error('Not logged in');
  const data = await res.json();
  return data.user.id;
}
</script>
</body>
</body>
</html>
