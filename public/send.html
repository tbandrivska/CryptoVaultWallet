<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoVault — Send</title>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/send.css">
</head>
<body>

<nav class="top-nav">
  <a class="logo" href="/index.html">Crypto<span>Vault</span></a>
  <a href="/index.html">Home</a>
  <a href="topup.html">Top Up</a>
  <a href="/portfolio.html">Portfolio</a>
  <a href="/send.html" class="active">Send</a>
  <a href="/receive.html">Receive</a>
  <a href="/recurring.html">Recurring</a>
  <a href="/history.html">History</a>
  <a href="/publicprofile.html">Public Profile</a>
  <a href="/settings.html">Settings</a>
  <a href="/logout">Logout</a>
</nav>

<div class="page-wrap">

  <div class="page-head">
    <h1>Send <span>Crypto</span></h1>
    <p>Transfer funds to any wallet address</p>
  </div>

  <div class="send-card">

    <div class="field">
      <label class="field-label" for="address">Recipient Address</label>
      <input type="text" id="address" placeholder="0x... or bc1...">
    </div>

    <div class="amount-row">
      <div class="field">
        <label class="field-label" for="amount">Amount</label>
        <input type="number" id="amount" placeholder="0.00000000" step="any" min="0">
      </div>
      <div class="field">
        <label class="field-label" for="currency">Currency</label>
        <select id="currency">
          <option value="BTC">₿ BTC</option>
          <option value="ETH">Ξ ETH</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary" id="sendBtn" onclick="sendCrypto()">
      Send Transaction →
    </button>

    <div class="status-strip" id="statusStrip">
      <span class="spinner" id="spinner" style="display:none"></span>
      <span id="statusMsg"></span>
    </div>

  </div>
</div>

<script>
async function getCurrentUserId() {
  const res = await fetch('/api/user');
  if (!res.ok) throw new Error('Not logged in');
  const data = await res.json();
  return data.user.id;
}

// Load user's wallets and populate the currency dropdown
async function loadWalletsForSend() {
  const userId = await getCurrentUserId();
  const res = await fetch(`/api/transactions/wallets/${userId}`);
  const wallets = await res.json();
  const currencySelect = document.getElementById('currency');
  const currencies = ['BTC', 'ETH'];
  currencySelect.innerHTML = currencies.map(cur => {
  const wallet = wallets.find(w => w.currency === cur);
  return wallet
    ? `<option value="${wallet.id}" data-currency="${cur}">${cur}${wallet.name ? ' (' + wallet.name + ')' : ''}</option>`
    : `<option value="" disabled>${cur} (no wallet)</option>`;
}).join('');
  if (!Array.isArray(wallets) || wallets.length === 0) {
    currencySelect.innerHTML = '<option value="">No wallets found. Create one in Settings.</option>';
    return;
  }
  currencySelect.innerHTML = wallets.map(w =>
    `<option value="${w.id}" data-currency="${w.currency}">${w.currency}${w.name ? ' (' + w.name + ')' : ''}</option>`
  ).join('');
}
document.addEventListener('DOMContentLoaded', loadWalletsForSend);

async function sendCrypto() {
  const address  = document.getElementById('address').value.trim();
  const amount   = parseFloat(document.getElementById('amount').value);
  const currencySelect = document.getElementById('currency');
  const walletId = currencySelect.value;
  const currency = currencySelect.options[currencySelect.selectedIndex].getAttribute('data-currency');
  const strip    = document.getElementById('statusStrip');
  const msg      = document.getElementById('statusMsg');
  const spinner  = document.getElementById('spinner');
  const btn      = document.getElementById('sendBtn');

  if (!address || !amount || amount <= 0) {
    strip.className = 'status-strip show error';
    spinner.style.display = 'none';
    msg.textContent = 'Please enter a valid address and amount.';
    return;
  }

  btn.disabled = true;
  strip.className = 'status-strip show info';
  spinner.style.display = '';
  msg.textContent = 'Processing transaction…';

  try {
    const res  = await fetch('/api/transactions/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ walletId, amount, address, currency })
    });
    const data = await res.json();

    spinner.style.display = 'none';
    btn.disabled = false;

    if (res.ok && data.success) {
      strip.className = 'status-strip show success';
      msg.textContent = `✓ Sent ${amount} ${currency}${data.value_gbp ? ` · £${data.value_gbp}` : ''}. TxID: ${data.txId || data.id || 'N/A'}`;
      document.getElementById('address').value = '';
      document.getElementById('amount').value  = '';
    } else {
      strip.className = 'status-strip show error';
      msg.textContent = data.message || 'Transaction failed.';
    }
  } catch {
    spinner.style.display = 'none';
    btn.disabled = false;
    strip.className = 'status-strip show error';
    msg.textContent = 'Could not reach the server.';
  }
}
</script>
</body>
</html>
