<!DOCTYPE html>
<html>
<head>
  <title>Send Crypto</title>
  <link rel="stylesheet" href="/send.css">
</head>
<body>
  <nav class="nav">
    <a href="send.html">Send</a>
    <a href="receive.html">Receive</a>
    <a href="recurring.html">Recurring</a>
    <a href="history.html">History</a>
  </nav>

  <div class="container">
    <h2>Send Crypto</h2>

    <label>Recipient Address</label>
    <input type="text" id="address">

    <label>Amount</label>
    <input type="number" id="amount">

    <label>Currency</label>
    <select id="currency">
      <option value="BTC">Bitcoin</option>
      <option value="ETH">Ethereum</option>
    </select>

    <button onclick="sendCrypto()">Send</button>

    <p id="message"></p>
    <p id="status"></p>
  </div>

  <script>
    async function sendCrypto() {
      const address = document.getElementById("address").value.trim();
      const amount = parseFloat(document.getElementById("amount").value);
      const currency = document.getElementById("currency").value;
      const status = document.getElementById("status");
      const msg = document.getElementById("message");

      if (!address || !amount || amount <= 0) {
        msg.innerText = "❌ Please enter a valid address and amount";
        msg.className = "error";
        return;
      }

      status.innerText = "Processing transaction...";
      msg.innerText = "";
      msg.className = "";

      try {
        const res = await fetch("/api/transactions/send", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ amount, address, currency })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          status.innerText = `Success! TxID: ${data.txId || data.id || "N/A"}`;
          msg.innerText = `✅ Sent ${amount} ${currency}${data.valueGBP ? ` (~£${data.valueGBP})` : ""}`;
          msg.className = "success";
        } else {
          status.innerText = data.message || "Transaction failed";
          msg.innerText = "❌ " + (data.message || "Transaction failed");
          msg.className = "error";
        }
      } catch (err) {
        status.innerText = "Error connecting to server";
        msg.innerText = "❌ Error connecting to server";
        msg.className = "error";
      }
    }
  </script>
</body>
</html>
