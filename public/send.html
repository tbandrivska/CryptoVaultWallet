<html>
<head>
  <title>Send Crypto</title>
  <link rel="stylesheet" href="/send.css">
</head>
<body>

<div class="container">
  <h2>Send Crypto</h2>

  <label>Recipient Address</label>
  <input type="text" id="address">

  <label>Amount</label>
  <input type="number" id="amount">
  <label>Currency</label>
  <select id="currency">
  <option value="BTC">Bitcoin</option>
  <option value="ETH">Ethereum</option>
</select>
  <button onclick="sendCrypto()">Send</button>

</div>
  <p id="message"></p>
</div>
<p id="status"></p>

<script>
async function sendCrypto() {
  const address = document.getElementById("address").value;
  const amount = parseFloat(document.getElementById("amount").value);
  const currency = document.getElementById("currency").value;
  const status = document.getElementById("status");
  const msg = document.getElementById("message");

  status.innerText = "Processing transaction...";
  msg.innerText = "";
  msg.className = "";


  const res = await fetch("http://localhost:3000/api/transactions/send", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ amount, address, currency })
  });

  const data = await res.json();

  if (data.success) {
    msg.innerText = `✅ Sent ${amount} ${currency} (~£${data.valueGBP})`;
    msg.className = "success";
  } else {
    msg.innerText = "❌ " + data.message;
    msg.className = "error";
  }
}
  // fake delay to simulate network latency
  setTimeout(async () => {
    try {
      const res = await fetch("http://localhost:3000/api/transactions/send", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ address, amount })
      });

      const data = await res.json();

      if (res.ok && data.success) {
        status.innerText = `Success!\nTxID: ${data.txId}\nNew Balance: ${data.newBalance}`;
        msg.innerText = "✅ Transaction successful!";
        msg.className = "success";
      } else {
        status.innerText = data.message || "Transaction failed";
        msg.innerText = "❌ " + (data.message || "Transaction failed");
        msg.className = "error";
      }

    } catch (err) {
      status.innerText = "Error connecting to server";
      msg.innerText = "❌ Error connecting to server";
      msg.className = "error";
    }
  }, 1500);

</script>

</body>
</html>
