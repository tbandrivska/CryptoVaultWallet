<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoVault — Create Account</title>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">

  <div class="brand">
    <div class="brand-icon">✦</div>
    <h2>Crypto<span>Vault</span></h2>
    <p>Create your secure wallet account</p>
  </div>

  <div class="form-wrapper">
    <div id="messageBox" class="hidden"></div>

    <form id="registerForm">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="satoshi" required>
      </div>

      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="input-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="+44 7700 900000" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min 8 chars, 1 uppercase, 1 number" required>
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
      </div>

      <button type="submit" class="btn btn-primary">Create Account →</button>
    </form>

    <div class="footer-links">
      <p>Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </div>

</div>
<script src="/register.js"></script>
</body>
</html>
