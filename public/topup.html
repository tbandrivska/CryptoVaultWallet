<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoVault — Top Up</title>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/topup.css">
</head>
<body>
  <nav class="top-nav">
    <a class="logo" href="/index.html">Crypto<span>Vault</span></a>
    <a href="/index.html">Home</a>
    <a href="/topup.html" class="active">Top Up</a>
    <a href="/portfolio.html">Portfolio</a>
    <a href="/send.html">Send</a>
    <a href="/receive.html">Receive</a>
    <a href="/recurring.html">Recurring</a>
    <a href="/history.html">History</a>
    <a href="/publicprofile.html">Public Profile</a>
    <a href="/settings.html">Settings</a>
    <a href="/logout.html" class="logout">Logout</a>
  </nav>

  <div class="page-wrap">
    <div class="page-head">
      <h1>Top Up <span>GBP</span></h1>
      <p>Add funds to your CryptoVault account (mock only)</p>
    </div>
    <div class="topup-card">
      <form id="topupForm">
        <div class="input-group">
          <label for="amount">Amount (GBP)</label>
          <input type="number" id="amount" min="1" step="1" placeholder="Enter amount" required>
        </div>
        <button type="submit" class="btn btn-primary">Top Up</button>
        <div id="topupMsg" class="status-text"></div>
      </form>
    </div>
  </div>

<script>
    async function loadWallets() {
  const res = await fetch('/api/transactions/wallets/1');
  const wallets = await res.json();
  const list = document.getElementById('walletsList');
  if (!Array.isArray(wallets) || wallets.length === 0) {
    list.innerHTML = "<p>No wallets found.</p>";
    return;
  }
  list.innerHTML = wallets.map(w =>
    `<div class="wallet-row">
      <span class="wallet-currency">${w.currency}${w.name ? ' (' + w.name + ')' : ''}</span>
      <span class="wallet-balance">${Number(w.balance).toLocaleString(undefined, {maximumFractionDigits: 8})} ${w.currency === 'GBP' ? '£' : w.currency}</span>
    </div>`
  ).join('');
}

async function updateWalletValue() {
  const res = await fetch('/api/transactions/wallets/1');
  const wallets = await res.json();
  const gbpWallet = wallets.find(w => w.currency === 'GBP');
  const walletValueElem = document.getElementById('wallet-balance');
  if (gbpWallet) {
    walletValueElem.textContent = `£${Number(gbpWallet.balance).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
  } else {
    walletValueElem.textContent = "£0.00";
  }
}

// Initial load
loadWallets();
updateWalletValue();
document.getElementById('topupForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const amount = parseFloat(document.getElementById('amount').value);
    const msg = document.getElementById('topupMsg');
    msg.textContent = '';
    if (isNaN(amount) || amount <= 0) {
        msg.textContent = "Enter a valid amount.";
        msg.style.color = "var(--danger)";
        return;
    }
    try {
        const res = await fetch('/api/transactions/topup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: 1, amount })
        });
        const data = await res.json();
        if (data.success) {
    let newBalance = Number(data.newBalance);
    if (isNaN(newBalance)) newBalance = 0;
    msg.textContent = "Top-up successful! New balance: £" + newBalance.toFixed(2);
    msg.style.color = "var(--success)";
    document.getElementById('amount').value = '';
    const balanceElem = document.getElementById('wallet-balance');
    loadWallets();
    updateWalletValue();
    if (balanceElem) {
        balanceElem.textContent = "£" + newBalance.toFixed(2);
    }
} else {
    msg.textContent = data.message || "Top-up failed.";
    msg.style.color = "var(--danger)";
    }
} catch (err) {
    console.error(err); // This logs the full error to the browser console
    msg.textContent = "Network error.";
    msg.style.color = "var(--danger)";
    }
});
</script>
