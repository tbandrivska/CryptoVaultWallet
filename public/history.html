<html>
<head>
  <title>Transaction History</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .tx { border-bottom: 1px solid #ccc; padding: 10px 0; }
  </style>
</head>
<body>

<h2>Transaction History</h2>

<button onclick="loadHistory()">Load Transactions</button>

<div id="history"></div>

<script>
async function loadHistory() {
  const walletId = 1; // demo wallet

  const res = await fetch(`http://localhost:3000/api/transactions/history/${walletId}`);
  const data = await res.json();

  const container = document.getElementById("history");
  container.innerHTML = "";

  data.forEach(tx => {
    const div = document.createElement("div");

    div.innerHTML = `
      <strong>${tx.type}</strong><br>
      ${tx.amount} ${tx.currency}<br>
      £${tx.value_gbp}<br>
      ${tx.timestamp}
    `;

    container.appendChild(div);
  });
}

</script>
</body>
</html>
